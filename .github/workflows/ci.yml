name: CI

on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.3
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed --output=none .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Coverage floor (80%)
        run: |
          python3 - <<'EOF'
          import sys
          lf = lh = 0
          with open('coverage/lcov.info') as f:
              for line in f:
                  if line.startswith('LF:'):
                      lf += int(line[3:])
                  elif line.startswith('LH:'):
                      lh += int(line[3:])
          if lf == 0:
              sys.exit('coverage floor: lcov.info contained no line data')
          pct = lh / lf * 100
          print(f'line coverage: {lh}/{lf} = {pct:.2f}% (floor 80%)')
          if pct < 80:
              sys.exit(f'coverage {pct:.2f}% is below the 80% floor')
          EOF